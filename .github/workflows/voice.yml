name: Voice Bot

on:
  schedule:
    - cron: '0 8 * * *'      # 9 AM WAT  — Morning take
    - cron: '0 12 * * *'     # 1 PM WAT  — Transfer reaction
    - cron: '0 17 * * *'     # 6 PM WAT  — Matchday hype
    - cron: '0 21 * * *'     # 10 PM WAT — Post-match take
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install requests google-generativeai edge-tts

      - run: python voice_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save voice state
        run: |
          git config user.name "Football Bot"
          git config user.email "bot@football.local"
          git add voice_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update voice state [skip ci]"
          git push || true
