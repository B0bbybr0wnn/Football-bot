name: Football Bot

on:
  schedule:
    - cron: '0 6 * * *'    # 7 AM WAT / 1 AM EST
    - cron: '0 10 * * *'   # 11 AM WAT / 5 AM EST
    - cron: '0 14 * * *'   # 3 PM WAT / 9 AM EST
    - cron: '0 18 * * *'   # 7 PM WAT / 1 PM EST
    - cron: '0 22 * * *'   # 11 PM WAT / 5 PM EST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser google-generativeai
      - run: python football_bot.py
