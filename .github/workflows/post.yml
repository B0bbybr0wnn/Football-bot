name: Football Bot

on:
  schedule:
    - cron: '0 5 * * *'    # 6 AM WAT  - Player Spotlight
    - cron: '0 7 * * *'    # 8 AM WAT  - Transfer News
    - cron: '0 9 * * *'    # 10 AM WAT - Club Focus
    - cron: '0 11 * * *'   # 12 PM WAT - Scandal & Drama
    - cron: '0 14 * * *'   # 3 PM WAT  - Match Preview
    - cron: '0 17 * * *'   # 6 PM WAT  - Match Recap
    - cron: '0 20 * * *'   # 9 PM WAT  - Player Spotlight
    - cron: '0 23 * * *'   # 2 AM WAT  - Transfer News
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests feedparser google-generativeai

      - run: python football_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Save state files
        run: |
          git config user.name "Football Bot"
          git config user.email "bot@football.local"
          git add posted.json live_messages.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true
