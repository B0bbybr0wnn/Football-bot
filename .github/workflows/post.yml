name: Football Bot

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests feedparser google-generativeai

      - run: python football_bot.py

      - name: Save posted list back to repo
        run: |
          git config user.name "Football Bot"
          git config user.email "bot@football.local"
          git add posted.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted list [skip ci]"
          git push || true
