name: Football Bot

on:
  schedule:
    - cron: '0 5 * * *'    # 6 AM WAT / 1 AM EST
    - cron: '0 8 * * *'    # 9 AM WAT / 4 AM EST
    - cron: '0 11 * * *'   # 12 PM WAT / 7 AM EST
    - cron: '0 14 * * *'   # 3 PM WAT / 9 AM EST
    - cron: '0 17 * * *'   # 6 PM WAT / 1 PM EST
    - cron: '0 20 * * *'   # 9 PM WAT / 4 PM EST
    - cron: '0 23 * * *'   # 2 AM WAT / 9 PM EST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests feedparser google-generativeai

      - run: python football_bot.py

      - name: Save posted list back to repo
        run: |
          git config user.name "Football Bot"
          git config user.email "bot@football.local"
          git add posted.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted list [skip ci]"
          git push || true
