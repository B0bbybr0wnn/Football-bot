name: Match Announcements

on:
  schedule:
    - cron: '0 10 * * *'    # 11 AM WAT — 2-day reminder
    - cron: '0 19 * * *'    # 8 PM WAT — tomorrow reminder
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests google-generativeai

      - run: python match_announcements.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}

      - name: Save announcement state
        run: |
          git config user.name "Football Bot"
          git config user.email "bot@football.local"
          git add announced_2days.json announced_tomorrow.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update announcements [skip ci]"
          git push || true
